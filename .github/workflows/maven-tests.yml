name: Pruebas Maven

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Java 17 - Maven test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Mostrar versiones
        run: |
          java -version
          mvn -version

      - name: Compilar y ejecutar pruebas
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
